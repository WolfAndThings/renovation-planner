<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Exterior Renovation Planner</title>
<style>
:root {
  --bg: #f5f3ef;
  --card: #fff;
  --border: #e0dcd4;
  --text: #2c2c2c;
  --muted: #6b6560;
  --accent: #4a7c59;
  --accent-lt: #e8f0eb;
  --warn: #c47a2a;
  --warn-lt: #fef3e2;
  --danger: #b44040;
  --blocked: #9b59b6;
  --ready: #2980b9;
  --ready-lt: #e8f4fd;
  --progress: #e8a838;
  --radius: 8px;
  --radius-sm: 4px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}

.hdr{background:#2c2c2c;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.hdr h1{font-size:16px;font-weight:600}
.hdr-actions{display:flex;gap:6px}
.hdr-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;padding:5px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:12px}
.hdr-btn:hover{background:rgba(255,255,255,.22)}

.wrap{max-width:800px;margin:0 auto;padding:16px}

/* Tabs */
.tabs{display:flex;gap:3px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:4px;margin-bottom:16px;overflow-x:auto}
.tab{padding:8px 16px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;border:none;background:0;color:var(--muted)}
.tab:hover{background:var(--bg);color:var(--text)}
.tab.on{background:var(--accent);color:#fff}

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card-pad{padding:14px}

/* Steps */
.steps{position:relative;padding-left:32px}
.steps::before{content:'';position:absolute;left:13px;top:0;bottom:0;width:2px;background:var(--border)}
.step{position:relative;padding:0 0 24px 16px}
.step:last-child{padding-bottom:0}
.step-dot{position:absolute;left:-25px;top:3px;width:16px;height:16px;border-radius:50%;border:2px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;z-index:1}
.step.done .step-dot{background:var(--accent);border-color:var(--accent)}
.step.done .step-dot::after{content:'✓';color:#fff;font-weight:700}
.step.active .step-dot{background:var(--progress);border-color:var(--progress);box-shadow:0 0 0 4px rgba(232,168,56,.2)}
.step.active .step-dot::after{content:'';width:6px;height:6px;background:#fff;border-radius:50%}
.step-phase{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;display:inline-block;padding:3px 10px;border-radius:10px;margin-bottom:8px}
.phase-decide{background:var(--accent-lt);color:var(--accent)}
.phase-buy{background:var(--ready-lt);color:var(--ready)}
.phase-build{background:var(--warn-lt);color:var(--warn)}
.phase-contractor{background:#f3e8f9;color:var(--blocked)}
.phase-finish{background:#e8f0eb;color:var(--accent)}

.step-title{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.step.done .step-title{color:var(--accent);opacity:.6}
.step-sub{font-size:13px;color:var(--muted);margin-top:2px}

/* Step expandable content */
.step-body{margin-top:10px;padding:12px;background:var(--bg);border-radius:var(--radius-sm);border:1px solid var(--border)}
.step-body.collapsed{display:none}

/* Checklist inside steps */
.check-item{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);font-size:14px}
.check-item:last-child{border-bottom:none}
.check-item input[type=checkbox]{width:18px;height:18px;margin-top:1px;cursor:pointer;accent-color:var(--accent);flex-shrink:0}
.check-item label{flex:1;cursor:pointer}
.check-item label.done{text-decoration:line-through;color:var(--muted)}
.check-item .check-note{font-size:12px;color:var(--muted);display:block}

/* Decision option cards */
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:8px}
.opt{border:2px solid var(--border);border-radius:var(--radius);padding:8px;cursor:pointer;text-align:center;font-size:13px;font-weight:500;transition:.15s}
.opt:hover{border-color:var(--accent)}
.opt.picked{border-color:var(--accent);background:var(--accent-lt)}
.opt img{width:100%;height:80px;object-fit:cover;border-radius:var(--radius-sm);margin-bottom:6px}
.opt-add{border-style:dashed;color:var(--muted);display:flex;align-items:center;justify-content:center;min-height:60px}
.opt-add:hover{color:var(--accent);border-color:var(--accent)}

/* Shopping */
.shop-item{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
.shop-item:last-child{border-bottom:none}
.shop-item input[type=checkbox]{width:18px;height:18px;margin-top:1px;cursor:pointer;accent-color:var(--accent);flex-shrink:0}
.shop-item-name{font-weight:500}
.shop-item-name.bought{text-decoration:line-through;color:var(--muted)}
.shop-item-detail{font-size:12px;color:var(--muted)}
.shop-group{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:10px 0 4px;border-bottom:2px solid var(--border)}
.shop-input{display:flex;gap:6px;margin-bottom:12px}
.shop-input input{flex:1;padding:10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:15px;font-family:inherit}
.shop-input input:focus{outline:none;border-color:var(--accent)}
.shop-input select{padding:10px 8px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px}

/* Buttons */
.btn{padding:8px 14px;border:none;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-weight:500}
.btn-p{background:var(--accent);color:#fff}
.btn-p:hover{background:#3d6a4b}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-o{background:0;border:1px solid var(--border);color:var(--text)}
.btn-del{background:none;border:none;color:#ccc;cursor:pointer;font-size:16px;padding:2px 6px}
.btn-del:hover{color:var(--danger)}

/* Photos */
.photo-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.photo-thumb{width:100px;height:100px;border-radius:var(--radius-sm);object-fit:cover;border:1px solid var(--border);cursor:pointer}
.photo-add{width:100px;height:100px;border:2px dashed var(--border);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);font-size:12px;text-align:center}
.photo-add:hover{border-color:var(--accent);color:var(--accent)}
.photo-wrap{position:relative}
.photo-x{position:absolute;top:-5px;right:-5px;width:18px;height:18px;border-radius:50%;background:var(--danger);color:#fff;border:none;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center}

/* Guides */
.guide-list{list-style:none;margin-top:6px}
.guide-list li{padding:4px 0;border-bottom:1px solid var(--border)}
.guide-list li:last-child{border-bottom:none}
.guide-link{color:var(--accent);text-decoration:none;font-size:13px;font-weight:500}
.guide-link:hover{text-decoration:underline}
.guide-link::before{content:'↗ ';font-size:11px;opacity:.6}
.guide-cat{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-top:8px;margin-bottom:2px}

/* Notes */
.notes-area{width:100%;min-height:120px;padding:10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:inherit;font-size:14px;resize:vertical}
.notes-area:focus{outline:none;border-color:var(--accent)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;text-align:center}
.stat b{font-size:24px;display:block;line-height:1.1}
.stat small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}

/* Modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal-bg img{max-width:90vw;max-height:90vh;border-radius:var(--radius)}
.modal-close{position:fixed;top:14px;right:14px;background:#fff;border:none;width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;z-index:201}

.hidden{display:none}

/* Sub-headers in steps */
.step-section{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-top:10px;margin-bottom:4px}

/* Measurements */
.meas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px;margin-top:6px}
.meas-item{background:#fff;padding:6px 8px;border-radius:var(--radius-sm);border:1px solid var(--border)}
.meas-item label{font-size:11px;font-weight:600;color:var(--muted);display:block;margin-bottom:2px}
.meas-item input{width:100%;padding:5px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px}
.meas-item input:focus{outline:none;border-color:var(--accent)}

/* Toggle */
.toggle-btn{background:none;border:none;color:var(--accent);cursor:pointer;font-size:12px;font-weight:500;padding:0}
.toggle-btn:hover{text-decoration:underline}

/* Print */
@media print{.hdr,.tabs,.hdr-actions,.btn,.modal-bg,.shop-input,.photo-add,.toggle-btn{display:none!important}body{background:#fff}.step-body.collapsed{display:block!important}}

/* Mobile */
@media(max-width:768px){
  .wrap{padding:10px}
  .hdr{padding:12px 14px;flex-wrap:wrap;gap:8px}
  .hdr h1{font-size:14px}
  .tabs{gap:2px;flex-wrap:nowrap;overflow-x:auto;padding:3px}
  .tab{padding:8px 12px;font-size:12px;flex-shrink:0}
  .step-title{font-size:14px}
  .step-body input,.step-body select,.step-body textarea{font-size:16px}
  .check-item input[type=checkbox]{width:22px;height:22px}
  .check-item{font-size:15px;padding:9px 0}
  .shop-item input[type=checkbox]{width:22px;height:22px}
  .shop-item{font-size:15px;padding:10px 0}
  .shop-input{flex-direction:column}
  .shop-input input,.shop-input select{font-size:16px}
  .btn{padding:10px 16px;font-size:14px}
  .opts{grid-template-columns:repeat(2,1fr)}
  .stats{grid-template-columns:repeat(2,1fr)}
  .meas-grid{grid-template-columns:1fr}
  .photo-thumb,.photo-add{width:85px;height:85px}
}
</style>
</head>

    { id: 's4', name: 'Sprayer tip (411 or 413)', qty: '1 extra', area: 'Soffits', bought: false, notes: 'Grab a spare — tips wear out' },

    { id: 's6', name: 'Extension ladder (20 or 24 ft)', qty: '1', area: 'Soffits', bought: false, notes: 'Keller KPro fiberglass 300lb Type IA' },
    { id: 's7', name: 'Sandpaper (120 & 220 grit)', qty: '1 pack each', area: 'Soffits', bought: false, notes: '' },
    { id: 's8', name: 'TSP cleaner', qty: '1 box', area: 'Soffits', bought: false, notes: '' },
    { id: 's9', name: 'Painters tape (2")', qty: '3-4 rolls', area: 'Soffits', bought: false, notes: 'Sprayer needs extra masking' },
    { id: 's10', name: 'Plastic sheeting / masking film', qty: '1 roll', area: 'Soffits', bought: false, notes: 'Cover walls, windows, garage door' },
    { id: 's11', name: 'Drop cloths', qty: '3-4', area: 'Soffits', bought: false, notes: '' },
    { id: 's12', name: 'Angled trim brush (2")', qty: '1', area: 'Soffits', bought: false, notes: 'Touch-ups' },
    { id: 's13', name: 'Caulk (paintable exterior) + gun', qty: '1 tube + gun', area: 'Soffits', bought: false, notes: '' },
    { id: 's14', name: '5 gal bucket + paint strainer bags', qty: '1 + 1 pack', area: 'Soffits', bought: false, notes: 'Strain before spraying' },
    { id: 's15', name: 'Mineral spirits / pump armor', qty: '1', area: 'Soffits', bought: false, notes: 'Sprayer cleanup' },

    // Eyebrow Awning
    { id: 'a1', name: '2x8 treated lumber (beams)', qty: 'TBD', area: 'Awning', bought: false, notes: 'Measure first' },
    { id: 'a2', name: '2x6 treated lumber (rafters)', qty: 'TBD', area: 'Awning', bought: false, notes: 'Spaced 16" OC' },
    { id: 'a3', name: '2x2 cedar or treated (top slats)', qty: 'TBD', area: 'Awning', bought: false, notes: '' },
    { id: 'a4', name: 'Structural screws (GRK, 4")', qty: '1 box', area: 'Awning', bought: false, notes: '' },
    { id: 'a5', name: 'Lag bolts (3/8" x 4-5")', qty: '8-12', area: 'Awning', bought: false, notes: 'Ledger to wall studs' },
    { id: 'a6', name: 'Angle brackets / rafter hangers', qty: '6-8', area: 'Awning', bought: false, notes: 'Simpson Strong-Tie' },
    { id: 'a7', name: 'Flashing (aluminum, 4-6")', qty: '1 roll', area: 'Awning', bought: false, notes: 'CRITICAL — prevents water behind wall' },
    { id: 'a8', name: 'Exterior stain or paint', qty: '1 quart', area: 'Awning', bought: false, notes: 'Match trim color' },
    { id: 'a9', name: 'Construction adhesive', qty: '1 tube', area: 'Awning', bought: false, notes: 'PL Premium' },

    // Deck
    { id: 'd1', name: 'Deck boards (5/4 x 6 treated)', qty: 'TBD', area: 'Deck', bought: false, notes: 'Match existing board size' },
    { id: 'd2', name: 'Deck screws (#10 x 2-3/4" coated)', qty: '1 lb box', area: 'Deck', bought: false, notes: 'Star/Torx drive' },
    { id: 'd3', name: 'Deck stain', qty: 'TBD', area: 'Deck', bought: false, notes: 'Cabot, TWP, or Olympic' },
    { id: 'd4', name: 'Deck cleaner / brightener', qty: '1 gallon', area: 'Deck', bought: false, notes: '' },
    { id: 'd5', name: 'Stain applicator pad', qty: '1', area: 'Deck', bought: false, notes: 'Fastest for deck staining' },
    { id: 'd6', name: 'Paintbrush (4")', qty: '1', area: 'Deck', bought: false, notes: 'Rails, edges, between boards' },
    { id: 'd7', name: 'Wood filler (exterior)', qty: '1 tube', area: 'Deck', bought: false, notes: '' },
    { id: 'd8', name: 'Sandpaper (80 grit)', qty: '1 pack', area: 'Deck', bought: false, notes: 'Sand new boards' },
    { id: 'd9', name: 'Pry bar / flat bar', qty: '1', area: 'Deck', bought: false, notes: '' },
    { id: 'd10', name: 'Torx bits (T25)', qty: '1 pack', area: 'Deck', bought: false, notes: '' },
    { id: 'd11', name: 'End cut sealer', qty: '1 quart', area: 'Deck', bought: false, notes: 'Seal cut ends' },
  ],

  globalNotes: '',
  globalPhotos: [],
  log: [],
};

// ===========================
// STATE
// ===========================
let D, tab = 'flow';
function load() {
  try {
    const s = localStorage.getItem('reno-v2');
    if (s) { D = JSON.parse(s); if (!D.log) D.log = []; if (!D.globalPhotos) D.globalPhotos = []; if (!D.shoppingList) D.shoppingList = DEFAULT_DATA.shoppingList; return; }
  } catch(e) {}
  D = JSON.parse(JSON.stringify(DEFAULT_DATA));
}
load();
function save() { localStorage.setItem('reno-v2', JSON.stringify(D)); }
function addLog(m) { D.log.unshift({ d: new Date().toLocaleString(), m }); if (D.log.length > 100) D.log.length = 100; save(); }
function uid() { return 'id_' + Math.random().toString(36).substr(2, 9); }
function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// Track which steps are expanded
let expanded = {};

// ===========================
// RENDER
// ===========================
const TABS = [
  { id: 'flow', l: 'The Plan' },
  { id: 'shopping', l: 'Shopping List' },
  { id: 'notes', l: 'Notes & Photos' },
  { id: 'log', l: 'Activity Log' },
];

function render() {
  document.getElementById('tabs').innerHTML = TABS.map(t =>
    `<button class="tab${tab === t.id ? ' on' : ''}" onclick="tab='${t.id}';render()">${t.l}</button>`
  ).join('');
  const c = document.getElementById('content');
  if (tab === 'flow') c.innerHTML = renderFlow();
  else if (tab === 'shopping') c.innerHTML = renderShopping();
  else if (tab === 'notes') c.innerHTML = renderNotes();
  else if (tab === 'log') c.innerHTML = renderLog();
}

// ---- The Plan (main flow) ----
function renderFlow() {
  const total = D.steps.length;
  const done = D.steps.filter(s => s.done).length;
  const totalChecks = D.steps.reduce((n, s) => n + s.checks.length, 0);
  const doneChecks = D.steps.reduce((n, s) => n + s.checks.filter(c => c.done).length, 0);
  const toBuy = D.shoppingList.filter(i => !i.bought).length;

  let curPhase = '';
  let html = `
    <div class="stats">
      <div class="stat"><b>${done}/${total}</b><small>Steps Done</small></div>
      <div class="stat"><b>${doneChecks}/${totalChecks}</b><small>Tasks Done</small></div>
      <div class="stat"><b style="color:var(--ready)">${toBuy}</b><small>To Buy</small></div>
    </div>
    <div class="steps">
  `;

  D.steps.forEach((s, si) => {
    // Phase label
    if (s.phase !== curPhase) {
      curPhase = s.phase;
      const pcls = { Decide: 'phase-decide', Buy: 'phase-buy', Build: 'phase-build', Contractor: 'phase-contractor', Finish: 'phase-finish' }[s.phase] || '';
      html += `<div class="step-phase ${pcls}">${s.phase}</div>`;
    }

    // Step status
    const allChecksDone = s.checks.length > 0 && s.checks.every(c => c.done);
    const allDecsDone = s.decisions.length === 0 || s.decisions.every(d => d.status === 'chosen');
    const anyIP = s.checks.some(c => c.done) || s.decisions.some(d => d.status === 'researching');
    const cls = s.done ? 'done' : (anyIP ? 'active' : '');

    const isOpen = expanded[s.id] || false;
    const checksDone = s.checks.filter(c => c.done).length;
    const checkCount = s.checks.length;
    const progress = checkCount > 0 ? ` (${checksDone}/${checkCount})` : '';

    html += `
      <div class="step ${cls}">
        <div class="step-dot"></div>
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div style="flex:1;cursor:pointer" onclick="toggleStep('${s.id}')">
            <div class="step-title">
              ${esc(s.title)}
              ${checkCount ? `<span style="font-size:12px;color:var(--muted);font-weight:400">${progress}</span>` : ''}
            </div>
            <div class="step-sub">${esc(s.sub)}</div>
          </div>
          <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;margin-left:8px">
            <button class="toggle-btn" onclick="toggleStep('${s.id}')">${isOpen ? 'Close' : 'Open'}</button>
            <input type="checkbox" style="width:18px;height:18px;accent-color:var(--accent);cursor:pointer" ${s.done ? 'checked' : ''}
              onchange="D.steps[${si}].done=this.checked;addLog((this.checked?'Done':'Reopened')+': '+D.steps[${si}].title);save();render()">
          </div>
        </div>

        <div class="step-body ${isOpen ? '' : 'collapsed'}">
    `;

    // Decisions (with image options)
    if (s.decisions.length) {
      s.decisions.forEach((dec, di) => {
        html += `<div class="step-section">${esc(dec.name)} ${dec.value ? '— <strong>' + esc(dec.value) + '</strong>' : ''}</div>`;
        html += `<div class="opts">`;
        dec.options.forEach((o, oi) => {
          html += `
            <div class="opt ${o.selected ? 'picked' : ''}" onclick="pickOpt(${si},${di},${oi})">
              ${o.image ? `<img src="${o.image}" alt="${esc(o.label)}">` : ''}
              <div>${esc(o.label) || 'Option'}</div>
              <button class="btn-del" onclick="event.stopPropagation();D.steps[${si}].decisions[${di}].options.splice(${oi},1);save();render()" style="font-size:12px">&times;</button>
            </div>`;
        });
        html += `
          <div class="opt opt-add" onclick="addOpt(${si},${di})">+ Add Option</div>
          <div class="opt opt-add" onclick="document.getElementById('bulkOpt_${si}_${di}').click()">Upload Images
            <input type="file" id="bulkOpt_${si}_${di}" class="hidden" accept="image/*" multiple onchange="bulkOpt(${si},${di},this.files)">
          </div>
        </div>`;
      });
    }

    // Checklist
    if (s.checks.length) {
      html += `<div class="step-section">Checklist</div>`;
      s.checks.forEach((c, ci) => {
        html += `
          <div class="check-item">
            <input type="checkbox" id="chk_${si}_${ci}" ${c.done ? 'checked' : ''}
              onchange="D.steps[${si}].checks[${ci}].done=this.checked;save();render()">
            <label for="chk_${si}_${ci}" class="${c.done ? 'done' : ''}">${esc(c.text)}</label>
          </div>`;
      });
    }

    // Measurements
    if (s.measurements.length) {
      html += `<div class="step-section">Measurements</div><div class="meas-grid">`;
      s.measurements.forEach((m, mi) => {
        html += `<div class="meas-item"><label>${esc(m.l)}</label><input value="${esc(m.v)}" onchange="D.steps[${si}].measurements[${mi}].v=this.value;save()"></div>`;
      });
      html += `</div>`;
    }

    // Notes
    html += `<div class="step-section">Notes</div>
      <textarea class="notes-area" style="min-height:50px" onchange="D.steps[${si}].notes=this.value;save()">${esc(s.notes)}</textarea>`;

    // Photos
    html += `<div class="step-section">Photos</div><div class="photo-grid">`;
    (s.photos || []).forEach((p, pi) => {
      html += `<div class="photo-wrap"><img class="photo-thumb" src="${p.src}" onclick="openModal('${p.src.replace(/'/g, "\\'")}')"><button class="photo-x" onclick="D.steps[${si}].photos.splice(${pi},1);save();render()">&times;</button></div>`;
    });
    html += `<div class="photo-add" onclick="document.getElementById('stepPhoto_${si}').click()">+ Photo<input type="file" id="stepPhoto_${si}" class="hidden" accept="image/*" onchange="stepPhoto(${si},this.files[0])"></div></div>`;

    // Guides
    if (s.guides.length) {
      html += `<div class="step-section">Guides & Links</div><ul class="guide-list">`;
      let curCat = '';
      s.guides.forEach(g => {
        if (g.cat && g.cat !== curCat) { curCat = g.cat; html += `<li><div class="guide-cat">${esc(g.cat)}</div></li>`; }
        else if (!g.cat && curCat) { curCat = ''; }
        html += `<li><a class="guide-link" href="${g.url}" target="_blank" rel="noopener">${esc(g.title)}</a></li>`;
      });
      html += `</ul>`;
    }

    html += `</div></div>`; // close step-body + step
  });

  html += `</div>`; // close steps
  return html;
}

// ---- Step interactions ----
function toggleStep(id) { expanded[id] = !expanded[id]; render(); }

function pickOpt(si, di, oi) {
  const dec = D.steps[si].decisions[di];
  const was = dec.options[oi].selected;
  dec.options.forEach(o => o.selected = false);
  if (!was) {
    dec.options[oi].selected = true;
    dec.value = dec.options[oi].label || 'Option ' + (oi + 1);
    dec.status = 'chosen';
    addLog('Picked ' + dec.name + ': ' + dec.value);
  } else {
    dec.value = '';
    dec.status = dec.options.length ? 'researching' : 'not-started';
  }
  save(); render();
}

function addOpt(si, di) {
  D.steps[si].decisions[di].options.push({ id: uid(), label: '', image: '', selected: false });
  if (D.steps[si].decisions[di].status === 'not-started') D.steps[si].decisions[di].status = 'researching';
  save(); render();
}

function bulkOpt(si, di, files) {
  Array.from(files).forEach(f => {
    const r = new FileReader();
    r.onload = function(e) {
      D.steps[si].decisions[di].options.push({
        id: uid(), label: f.name.replace(/\.[^.]+$/, '').replace(/[-_]/g, ' '),
        image: e.target.result, selected: false
      });
      if (D.steps[si].decisions[di].status === 'not-started') D.steps[si].decisions[di].status = 'researching';
      save(); render();
    };
    r.readAsDataURL(f);
  });
}

function stepPhoto(si, f) {
  if (!f) return;
  const r = new FileReader();
  r.onload = function(e) { D.steps[si].photos.push({ src: e.target.result }); save(); render(); };
  r.readAsDataURL(f);
}

// ---- Shopping List ----
function renderShopping() {
  const list = D.shoppingList;
  const toBuy = list.filter(i => !i.bought);
  const bought = list.filter(i => i.bought);
  const groups = {};
  toBuy.forEach(i => { const k = i.area || 'Other'; if (!groups[k]) groups[k] = []; groups[k].push(i); });

  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <h2 style="font-size:18px">Menards Shopping List</h2>
      ${bought.length ? `<button class="btn btn-o btn-sm" onclick="D.shoppingList=D.shoppingList.filter(i=>!i.bought);save();render()">Clear bought</button>` : ''}
    </div>
    <div style="display:flex;gap:12px;margin-bottom:14px;font-size:14px">
      <span><b>${toBuy.length}</b> to buy</span>
      <span style="color:var(--accent)"><b>${bought.length}</b> bought</span>
    </div>
    <div class="shop-input">
      <input id="shopName" placeholder="Add item..." onkeydown="if(event.key==='Enter')addShop()">
      <input id="shopQty" placeholder="Qty" style="max-width:70px">
      <select id="shopArea"><option>Soffits</option><option>Awning</option><option>Deck</option><option>Other</option></select>
      <button class="btn btn-p" onclick="addShop()">Add</button>
    </div>
    <div class="card card-pad">
      ${Object.keys(groups).map(area => `
        <div class="shop-group">${esc(area)} (${groups[area].length})</div>
        ${groups[area].map(item => {
          const idx = list.indexOf(item);
          return `<div class="shop-item">
            <input type="checkbox" onchange="D.shoppingList[${idx}].bought=true;addLog('Bought: '+D.shoppingList[${idx}].name);save();render()">
            <div style="flex:1">
              <div class="shop-item-name">${esc(item.name)}</div>
              <div class="shop-item-detail">${esc(item.qty)}${item.notes ? ' — ' + esc(item.notes) : ''}</div>
            </div>
            <button class="btn-del" onclick="D.shoppingList.splice(${idx},1);save();render()">&times;</button>
          </div>`;
        }).join('')}
      `).join('')}
      ${bought.length ? `
        <div class="shop-group" style="color:var(--accent)">Bought (${bought.length})</div>
        ${bought.map(item => {
          const idx = list.indexOf(item);
          return `<div class="shop-item" style="opacity:.5">
            <input type="checkbox" checked onchange="D.shoppingList[${idx}].bought=false;save();render()">
            <div style="flex:1"><div class="shop-item-name bought">${esc(item.name)}</div></div>
            <button class="btn-del" onclick="D.shoppingList.splice(${idx},1);save();render()">&times;</button>
          </div>`;
        }).join('')}
      ` : ''}
    </div>
  `;
}

function addShop() {
  const n = document.getElementById('shopName'), q = document.getElementById('shopQty'), a = document.getElementById('shopArea');
  if (!n.value.trim()) return;
  D.shoppingList.push({ id: uid(), name: n.value.trim(), qty: q.value.trim(), area: a.value, bought: false, notes: '' });
  addLog('Added to list: ' + n.value.trim());
  n.value = ''; q.value = '';
  save(); render();
}

// ---- Notes & Photos ----
function renderNotes() {
  return `
    <h2 style="font-size:18px;margin-bottom:12px">Notes & Photos</h2>
    <div class="card card-pad">
      <textarea class="notes-area" onchange="D.globalNotes=this.value;save()">${esc(D.globalNotes)}</textarea>
    </div>
    <div class="card card-pad">
      <div style="font-weight:600;margin-bottom:8px">Photos</div>
      <div class="photo-grid">
        ${(D.globalPhotos||[]).map((p,i) => `<div class="photo-wrap"><img class="photo-thumb" src="${p.src}" onclick="openModal('${p.src.replace(/'/g, "\\'")}')"><button class="photo-x" onclick="D.globalPhotos.splice(${i},1);save();render()">&times;</button></div>`).join('')}
        <div class="photo-add" onclick="document.getElementById('gPhoto').click()">+ Photo<input type="file" id="gPhoto" class="hidden" accept="image/*" onchange="gPhotoUp(this.files[0])"></div>
      </div>
    </div>
  `;
}
function gPhotoUp(f) { if(!f)return; const r=new FileReader(); r.onload=function(e){D.globalPhotos.push({src:e.target.result});save();render()};r.readAsDataURL(f); }

// ---- Activity Log ----
function renderLog() {
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <h2 style="font-size:18px">Activity Log</h2>
      <button class="btn btn-o btn-sm" onclick="D.log=[];save();render()">Clear</button>
    </div>
    <div class="card card-pad">
      ${D.log.length ? D.log.map(e => `<div style="padding:4px 0;border-bottom:1px solid var(--border);font-size:13px;display:flex;gap:8px"><span style="color:var(--muted);font-size:12px;white-space:nowrap;flex-shrink:0">${e.d}</span><span>${esc(e.m)}</span></div>`).join('') : '<div style="color:var(--muted)">No activity yet</div>'}
    </div>
  `;
}

// ---- Modal ----
function openModal(src) { document.getElementById('modalImg').src = src; document.getElementById('modal').classList.add('open'); }
function closeModal() { document.getElementById('modal').classList.remove('open'); }

// ---- Export / Import ----
function exportJSON() {
  const b = new Blob([JSON.stringify(D, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'renovation_' + new Date().toISOString().slice(0, 10) + '.json'; a.click();
}
function importJSON(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = function(ev) {
    try { D = JSON.parse(ev.target.result); save(); render(); alert('Imported'); } catch(err) { alert('Invalid file'); }
  }; r.readAsText(f);
}

// ---- Init ----
render();
</script>
